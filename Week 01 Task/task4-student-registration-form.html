<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task-4 Student Registration Form</title>
</head>

<body>

    <h1>Student Registration Form</h1>

    <p>
        Please fill in the form below to register as a student.
    </p>

    <hr>

    <form>

        <!-- Personal Information -->
        <h2>Personal Information</h2>

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required>

        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>

        <br><br>

        <label>Gender:</label>

        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>

        <hr>

        <!-- Course Information -->
        <h2>Course Information</h2>

        <label for="course">Select Course:</label>

        <select id="course" name="course" required>
            <option value="">-- Select Course --</option>
            <option value="bca">BCA</option>
            <option value="btech">B.Tech</option>
            <option value="mca">MCA</option>
            <option value="bsc">B.Sc</option>
            <option value="bba">BBA</option>
        </select>

        <br><br>

        <label for="qualification">Previous Qualification:</label>

        <select id="qualification" name="qualification">
            <option value="">-- Select Qualification --</option>
            <option value="10th">10th</option>
            <option value="12th">12th</option>
            <option value="diploma">Diploma</option>
            <option value="graduation">Graduation</option>
        </select>

        <hr>

        <!-- Address -->
        <h2>Address</h2>

        <label for="address">Full Address:</label>
        <br>

        <textarea id="address" name="address" rows="5" cols="40" placeholder="Enter your full address"
            required></textarea>

        <hr>

        <!-- Interests -->

        <h2>Interests</h2>

        <p>Select your interests:</p>

        <input type="checkbox" id="coding" name="interest" value="coding">
        <label for="coding">Coding</label>

        <br>

        <input type="checkbox" id="reading" name="interest" value="reading">
        <label for="reading">Reading</label>

        <br>

        <input type="checkbox" id="sports" name="interest" value="sports">
        <label for="sports">Sports</label>

        <br>

        <input type="checkbox" id="music" name="interest" value="music">
        <label for="music">Music</label>

        <br>

        <input type="checkbox" id="other" name="interest" value="other">
        <label for="other">Other:</label>

        <input type="text" id="otherInterest" name="otherInterest" placeholder="Enter your interest">


        <hr>

        <!-- Buttons -->
        <h2>Submit Form</h2>

        <button type="submit">Submit</button>

        <button type="reset">Reset</button>

    </form>

</body>

</html>
